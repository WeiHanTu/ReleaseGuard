{{- if .Values.metricGate.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "releaseguard.metricGateFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "releaseguard.metricGateLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "releaseguard.metricGateSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.metricGate.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
