apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "releaseguard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "releaseguard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "releaseguard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "releaseguard.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "releaseguard.serviceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: operator
          image: {{ include "releaseguard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: RELEASEGUARD_HEALTH_PORT
              value: {{ .Values.operator.healthPort | quote }}
            - name: RELEASEGUARD_CLEANUP_DEADLINE
              value: {{ .Values.operator.cleanup.deadline | quote }}
            - name: RELEASEGUARD_CLEANUP_REQUEUE_INTERVAL
              value: {{ .Values.operator.cleanup.requeueInterval | quote }}
            - name: RELEASEGUARD_ANALYSIS_GATE_URL
              value: {{ default (printf "http://%s.%s.svc.cluster.local:%v/internal/v1/evaluations" (include "releaseguard.metricGateFullname" .) .Release.Namespace .Values.metricGate.service.port) .Values.operator.analysis.evaluationUrl | quote }}
            - name: RELEASEGUARD_ANALYSIS_AUTH_SECRET_NAME
              value: {{ .Values.operator.analysis.auth.existingSecret | quote }}
            - name: RELEASEGUARD_ANALYSIS_AUTH_SECRET_KEY
              value: {{ .Values.operator.analysis.auth.tokenKey | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: -Djava.io.tmpdir=/tmp -XX:MaxRAMPercentage=75.0
          ports:
            - name: health
              containerPort: {{ .Values.operator.healthPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
