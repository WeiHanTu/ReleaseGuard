apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "releaseguard.fullname" . }}
  labels:
    {{- include "releaseguard.labels" . | nindent 4 }}
rules:
  - apiGroups: ["delivery.weihantu.dev"]
    resources: ["releaseplans"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["delivery.weihantu.dev"]
    resources: ["releaseplans/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["delivery.weihantu.dev"]
    resources: ["releaseactions"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["delivery.weihantu.dev"]
    resources: ["releaseactions/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["delivery.weihantu.dev"]
    resources: ["releaseevents"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["delivery.weihantu.dev"]
    resources: ["releaseevents/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["delivery.weihantu.dev"]
    resources: ["metricpolicies"]
    verbs: ["get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["argoproj.io"]
    resources: ["analysistemplates"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["analysisruns"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
