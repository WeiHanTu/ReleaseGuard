{{- if .Values.metricGate.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "releaseguard.metricGateFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "releaseguard.metricGateLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.metricGate.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "releaseguard.metricGateSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "releaseguard.metricGateSelectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: metric-gate
          image: {{ include "releaseguard.metricGateImage" . | quote }}
          imagePullPolicy: {{ .Values.metricGate.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: RELEASEGUARD_GATE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metricGate.auth.existingSecret | quote }}
                  key: {{ .Values.metricGate.auth.tokenKey | quote }}
            - name: PROMETHEUS_BASE_URL
              value: {{ .Values.metricGate.prometheusBaseUrl | quote }}
            - name: GATE_REQUEST_TIMEOUT
              value: {{ .Values.metricGate.requestTimeout | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: -Djava.io.tmpdir=/tmp -XX:MaxRAMPercentage=75.0
          ports:
            - name: http
              containerPort: {{ .Values.metricGate.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.metricGate.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
