replicaCount: 1

image:
  repository: releaseguard-operator
  tag: dev
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

operator:
  healthPort: 8081
  leaderElection:
    enabled: true
    leaseName: releaseguard-operator-lock
  analysis:
    evaluationUrl: ""
    auth:
      existingSecret: releaseguard-metric-gate-auth
      tokenKey: token
  cleanup:
    deadline: 60s
    requeueInterval: 1s

metricGate:
  enabled: true
  replicaCount: 1
  image:
    repository: releaseguard-metric-gate
    tag: dev
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  prometheusBaseUrl: http://prometheus:9090
  requestTimeout: 10s
  auth:
    existingSecret: releaseguard-metric-gate-auth
    tokenKey: token
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
terminationGracePeriodSeconds: 30
revisionHistoryLimit: 3
