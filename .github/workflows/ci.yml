name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate wrapper checksum
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

  check:
    name: Java 21 clean check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Compile, format-check, test, and verify generated CRDs
        run: ./gradlew clean check --no-daemon

  packaging:
    name: Images, Helm, and GitOps
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: wrapper-validation
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and verify the hardened operator image
        env:
          RELEASEGUARD_OPERATOR_IMAGE: releaseguard-operator:dev
        run: ./tests/container/operator-image.sh
      - name: Build and verify the hardened metric-gate image
        env:
          RELEASEGUARD_GATE_IMAGE: releaseguard-metric-gate:dev
        run: ./tests/container/metric-gate-image.sh
      - name: Install checksum-pinned Helm
        run: ./scripts/install-helm.sh
      - name: Lint and verify the Helm chart
        run: ./tests/helm/chart.sh
      - name: Install checksum-pinned Kind
        run: ./scripts/install-kind.sh
      - name: Install through Helm and verify Argo CD sync and self-healing
        run: ./tests/e2e/kind-gitops.sh

  kind-e2e:
    name: Kind and Argo finalizer E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: wrapper-validation
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install checksum-pinned Kind
        run: ./scripts/install-kind.sh
      - name: Test finalizer behavior with the real Argo Rollouts controller
        run: ./tests/e2e/kind-finalizer.sh
