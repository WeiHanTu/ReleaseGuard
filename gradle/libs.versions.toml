[versions]
fabric8 = "7.8.0"
google-java-format = "1.36.1"
java-operator-sdk = "5.5.1"
jqwik = "1.10.1"
junit = "6.1.3"
ktlint = "1.8.0"
spotless = "8.10.0"
slf4j = "2.0.18"
spring-boot = "3.5.16"

[libraries]
fabric8-crd-generator-cli = { module = "io.fabric8:crd-generator-cli", version.ref = "fabric8" }
fabric8-generator-annotations = { module = "io.fabric8:generator-annotations", version.ref = "fabric8" }
fabric8-kubernetes-client-api = { module = "io.fabric8:kubernetes-client-api", version.ref = "fabric8" }
fabric8-kubernetes-client = { module = "io.fabric8:kubernetes-client", version.ref = "fabric8" }
fabric8-kube-api-test-client-inject = { module = "io.fabric8:kube-api-test-client-inject", version.ref = "fabric8" }
java-operator-sdk = { module = "io.javaoperatorsdk:operator-framework", version.ref = "java-operator-sdk" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
