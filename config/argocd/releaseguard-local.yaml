apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: releaseguard-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WeiHanTu/ReleaseGuard.git
    targetRevision: main
    path: environments/local
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: releaseguard-gitops
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
