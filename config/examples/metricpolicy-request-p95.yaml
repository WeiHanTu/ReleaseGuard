apiVersion: delivery.weihantu.dev/v1alpha1
kind: MetricPolicy
metadata:
  name: request-p95
spec:
  direction: LowerIsBetter
  unit: milliseconds
  valueQueryTemplate: |
    1000 * histogram_quantile(
      0.95,
      sum by (le) (
        rate(http_server_requests_seconds_bucket{release_revision="{{revision}}"}[{{window}}])
      )
    )
  sampleCountQueryTemplate: |
    sum(increase(http_server_requests_seconds_count{release_revision="{{revision}}"}[{{window}}]))
  allowedThresholds:
    canary:
      minimum: 0
      maximum: 2000
    stableDelta:
      minimum: 0
      maximum: 1000
  minimumSamples: 100
  window: 5m
  interval: 30s
  timeout: 5s
