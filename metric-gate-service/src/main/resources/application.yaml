releaseguard:
  gate:
    prometheus-base-url: ${PROMETHEUS_BASE_URL:http://prometheus:9090}
    request-timeout: ${GATE_REQUEST_TIMEOUT:10s}
    auth-token: ${RELEASEGUARD_GATE_AUTH_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful
